name: Android smoke test

# Pega este archivo en tu fork como: .github/workflows/android-smoke.yml
# (reemplaza el anterior). Al guardarlo (commit) se ejecuta solo.
# Tambien puedes lanzarlo a mano desde Actions > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar proyecto Android (NativeActivity + GLES2, paleta + log)
        run: |
          set -e
          P=android-min
          mkdir -p $P/app/src/main/cpp $P/app/src/main/res/values $P/app/src/main/res/values-v28

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SonicRushAndroid"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.srdc.port'
              compileSdk 34
              ndkVersion '26.1.10909125'

              defaultConfig {
                  applicationId 'com.srdc.port'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '0.2'
                  ndk { abiFilters 'arm64-v8a' }
              }

              externalNativeBuild {
                  cmake {
                      path 'src/main/cpp/CMakeLists.txt'
                      version '3.22.1'
                  }
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:label="Sonic Rush Port"
                  android:hasCode="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout|uiMode|smallestScreenSize|density">
                      <meta-data android:name="android.app.lib_name" android:value="srdc" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen" />
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v28/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(srdc C)

          set(GLUE ${ANDROID_NDK}/sources/android/native_app_glue)
          add_library(native_app_glue STATIC ${GLUE}/android_native_app_glue.c)
          target_include_directories(native_app_glue PUBLIC ${GLUE})

          add_library(srdc SHARED main.c)
          set_target_properties(srdc PROPERTIES LINK_FLAGS "-u ANativeActivity_onCreate")
          target_link_libraries(srdc native_app_glue android EGL GLESv2 log m)
          EOF

          cat > $P/app/src/main/cpp/main.c <<'EOF'
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <android/log.h>
          #include <android_native_app_glue.h>
          #include <math.h>
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>
          #include <time.h>

          /* ---- log: logcat + archivo log.txt en la carpeta de la app ---- */
          static FILE *g_log;
          static void LOG(const char *fmt, ...) {
              char buf[512];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof buf, fmt, ap);
              va_end(ap);
              __android_log_write(ANDROID_LOG_INFO, "srdc", buf);
              if (g_log) { fprintf(g_log, "%s\n", buf); fflush(g_log); }
          }

          #define VIEW_W 640
          #define VIEW_H 480

          typedef struct {
              EGLDisplay d;
              EGLSurface s;
              EGLContext c;
              int ready, swap;
              GLuint prog, tex_idx, tex_pal;
              GLint a_pos, a_uv, a_col, u_view, u_mode, u_row, u_tex, u_pal;
          } St;

          /* ---- shaders: modo 0 = color plano, modo 1 = textura con paleta (como PAL8 del PVR) ---- */
          static const char *VS =
              "attribute vec2 aPos;\n"
              "attribute vec2 aUV;\n"
              "attribute vec4 aCol;\n"
              "uniform vec2 uView;\n"
              "varying vec2 vUV;\n"
              "varying vec4 vCol;\n"
              "void main(){\n"
              "  vUV = aUV; vCol = aCol;\n"
              "  gl_Position = vec4(aPos.x / uView.x * 2.0 - 1.0, 1.0 - aPos.y / uView.y * 2.0, 0.0, 1.0);\n"
              "}\n";

          static const char *FS =
              "#ifdef GL_FRAGMENT_PRECISION_HIGH\n"
              "precision highp float;\n"
              "#else\n"
              "precision mediump float;\n"
              "#endif\n"
              "uniform sampler2D uTex;\n"
              "uniform sampler2D uPal;\n"
              "uniform float uMode;\n"
              "uniform float uRow;\n"
              "varying vec2 vUV;\n"
              "varying vec4 vCol;\n"
              "void main(){\n"
              "  if (uMode < 0.5) { gl_FragColor = vCol; return; }\n"
              "  float idx = floor(texture2D(uTex, vUV).r * 255.0 + 0.5);\n"
              "  vec4 c = texture2D(uPal, vec2((idx + 0.5) / 256.0, (uRow + 0.5) / 64.0));\n"
              "  if (c.a < 0.01) discard;\n"
              "  gl_FragColor = c * vCol;\n"
              "}\n";

          static GLuint compile(GLenum type, const char *src) {
              GLuint s = glCreateShader(type);
              GLint ok = 0;
              glShaderSource(s, 1, &src, NULL);
              glCompileShader(s);
              glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              if (!ok) {
                  char b[512];
                  glGetShaderInfoLog(s, sizeof b, NULL, b);
                  LOG("ERROR shader: %s", b);
              }
              return s;
          }

          static GLuint make_prog(void) {
              GLuint p = glCreateProgram();
              GLint ok = 0;
              glAttachShader(p, compile(GL_VERTEX_SHADER, VS));
              glAttachShader(p, compile(GL_FRAGMENT_SHADER, FS));
              glLinkProgram(p);
              glGetProgramiv(p, GL_LINK_STATUS, &ok);
              if (!ok) {
                  char b[512];
                  glGetProgramInfoLog(p, sizeof b, NULL, b);
                  LOG("ERROR link: %s", b);
              }
              return p;
          }

          static void tex_params(void) {
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
          }

          /* textura de indices 16x16 (8 bits por pixel, como PAL8); indice 0 = transparente */
          static GLuint make_idx_tex(void) {
              unsigned char px[16 * 16];
              GLuint t;
              for (int y = 0; y < 16; y++)
                  for (int x = 0; x < 16; x++) {
                      int border = (x == 0 || y == 0 || x == 15 || y == 15);
                      px[y * 16 + x] = border ? 0 : (unsigned char)(1 + ((x / 2 + y / 2) % 15));
                  }
              glGenTextures(1, &t);
              glBindTexture(GL_TEXTURE_2D, t);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_LUMINANCE, 16, 16, 0, GL_LUMINANCE, GL_UNSIGNED_BYTE, px);
              tex_params();
              return t;
          }

          /* paleta compartida: 64 filas x 256 colores (fila 0 = arcoiris, fila 1 = grises) */
          static GLuint make_pal_tex(void) {
              static unsigned char pal[64 * 256 * 4];
              GLuint t;
              memset(pal, 0, sizeof pal);
              for (int i = 1; i < 16; i++) {
                  unsigned char *a = &pal[(0 * 256 + i) * 4];
                  unsigned char *b = &pal[(1 * 256 + i) * 4];
                  a[0] = (unsigned char)(255.f * (0.5f + 0.5f * sinf(i * 0.45f)));
                  a[1] = (unsigned char)(255.f * (0.5f + 0.5f * sinf(i * 0.45f + 2.1f)));
                  a[2] = (unsigned char)(255.f * (0.5f + 0.5f * sinf(i * 0.45f + 4.2f)));
                  a[3] = 255;
                  b[0] = b[1] = b[2] = (unsigned char)(i * 17);
                  b[3] = 255;
              }
              glGenTextures(1, &t);
              glBindTexture(GL_TEXTURE_2D, t);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, 256, 64, 0, GL_RGBA, GL_UNSIGNED_BYTE, pal);
              tex_params();
              return t;
          }

          /* ---- EGL ---- */
          static int gl_init(St *st, ANativeWindow *w) {
              const EGLint cfg[] = {
                  EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                  EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                  EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8,
                  EGL_DEPTH_SIZE, 16, EGL_NONE};
              const EGLint ctx[] = {EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE};
              EGLConfig c;
              EGLint n = 0;
              st->d = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              eglInitialize(st->d, 0, 0);
              if (!eglChooseConfig(st->d, cfg, &c, 1, &n) || n < 1) { LOG("ERROR eglChooseConfig"); return -1; }
              st->s = eglCreateWindowSurface(st->d, c, w, 0);
              st->c = eglCreateContext(st->d, c, EGL_NO_CONTEXT, ctx);
              if (!eglMakeCurrent(st->d, st->s, st->s, st->c)) { LOG("ERROR eglMakeCurrent"); return -1; }
              LOG("GL_RENDERER=%s", (const char *)glGetString(GL_RENDERER));
              LOG("GL_VERSION=%s", (const char *)glGetString(GL_VERSION));

              st->prog = make_prog();
              st->a_pos = glGetAttribLocation(st->prog, "aPos");
              st->a_uv = glGetAttribLocation(st->prog, "aUV");
              st->a_col = glGetAttribLocation(st->prog, "aCol");
              st->u_view = glGetUniformLocation(st->prog, "uView");
              st->u_mode = glGetUniformLocation(st->prog, "uMode");
              st->u_row = glGetUniformLocation(st->prog, "uRow");
              st->u_tex = glGetUniformLocation(st->prog, "uTex");
              st->u_pal = glGetUniformLocation(st->prog, "uPal");
              glEnableVertexAttribArray(st->a_pos);
              glEnableVertexAttribArray(st->a_uv);
              glEnableVertexAttribArray(st->a_col);
              glActiveTexture(GL_TEXTURE0);
              st->tex_idx = make_idx_tex();
              glActiveTexture(GL_TEXTURE1);
              st->tex_pal = make_pal_tex();
              LOG("GL listo: shaders y texturas creados (glGetError=%d)", (int)glGetError());
              return 0;
          }

          static void gl_term(St *st) {
              if (st->d != EGL_NO_DISPLAY) {
                  eglMakeCurrent(st->d, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (st->c != EGL_NO_CONTEXT) eglDestroyContext(st->d, st->c);
                  if (st->s != EGL_NO_SURFACE) eglDestroySurface(st->d, st->s);
                  eglTerminate(st->d);
              }
              st->d = EGL_NO_DISPLAY;
              st->s = EGL_NO_SURFACE;
              st->c = EGL_NO_CONTEXT;
              st->ready = 0;
          }

          /* ---- dibujo en coordenadas 640x480 (como el Dreamcast) ---- */
          static void draw(const St *st, GLenum mode, const float *v, int n) {
              glVertexAttribPointer(st->a_pos, 2, GL_FLOAT, GL_FALSE, 32, v);
              glVertexAttribPointer(st->a_uv, 2, GL_FLOAT, GL_FALSE, 32, v + 2);
              glVertexAttribPointer(st->a_col, 4, GL_FLOAT, GL_FALSE, 32, v + 4);
              glDrawArrays(mode, 0, n);
          }

          static void quad(float *o, float x, float y, float w, float h) {
              const float p[6][4] = {{x, y, 0, 0}, {x + w, y, 1, 0}, {x, y + h, 0, 1},
                                     {x + w, y, 1, 0}, {x + w, y + h, 1, 1}, {x, y + h, 0, 1}};
              for (int i = 0; i < 6; i++) {
                  o[i * 8 + 0] = p[i][0];
                  o[i * 8 + 1] = p[i][1];
                  o[i * 8 + 2] = p[i][2];
                  o[i * 8 + 3] = p[i][3];
                  o[i * 8 + 4] = 1.f;
                  o[i * 8 + 5] = 1.f;
                  o[i * 8 + 6] = 1.f;
                  o[i * 8 + 7] = 1.f;
              }
          }

          static void render(St *st, float t) {
              EGLint sw = 0, sh = 0;
              float q[6 * 8];
              eglQuerySurface(st->d, st->s, EGL_WIDTH, &sw);
              eglQuerySurface(st->d, st->s, EGL_HEIGHT, &sh);

              glDisable(GL_SCISSOR_TEST);
              glViewport(0, 0, sw, sh);
              glClearColor(0.f, 0.f, 0.f, 1.f);
              glClear(GL_COLOR_BUFFER_BIT);

              /* vista 4:3 centrada (barras negras a los lados) */
              int vw = sw, vh = sw * 3 / 4;
              if (vh > sh) { vh = sh; vw = sh * 4 / 3; }
              int vx = (sw - vw) / 2, vy = (sh - vh) / 2;
              glViewport(vx, vy, vw, vh);
              glEnable(GL_SCISSOR_TEST);
              glScissor(vx, vy, vw, vh);
              glClearColor(0.08f, 0.08f, 0.25f, 1.f);
              glClear(GL_COLOR_BUFFER_BIT);
              glDisable(GL_SCISSOR_TEST);

              glEnable(GL_BLEND);
              glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
              glUseProgram(st->prog);
              glUniform2f(st->u_view, (float)VIEW_W, (float)VIEW_H);
              glActiveTexture(GL_TEXTURE0);
              glBindTexture(GL_TEXTURE_2D, st->tex_idx);
              glUniform1i(st->u_tex, 0);
              glActiveTexture(GL_TEXTURE1);
              glBindTexture(GL_TEXTURE_2D, st->tex_pal);
              glUniform1i(st->u_pal, 1);

              /* triangulo con colores por vertice (se mueve: confirma que hay fotogramas) */
              float dx = 80.f * sinf(t);
              float tri[3 * 8] = {
                  320.f + dx, 60.f, 0.f, 0.f, 1.f, 0.f, 0.f, 1.f,
                  260.f + dx, 160.f, 0.f, 0.f, 0.f, 1.f, 0.f, 1.f,
                  380.f + dx, 160.f, 0.f, 0.f, 0.f, 0.f, 1.f, 1.f};
              glUniform1f(st->u_mode, 0.f);
              draw(st, GL_TRIANGLES, tri, 3);

              /* la MISMA textura de indices con dos filas de paleta distintas; tocar la pantalla las intercambia */
              glUniform1f(st->u_mode, 1.f);
              quad(q, 120.f, 240.f, 160.f, 160.f);
              glUniform1f(st->u_row, st->swap ? 1.f : 0.f);
              draw(st, GL_TRIANGLES, q, 6);
              quad(q, 360.f, 240.f, 160.f, 160.f);
              glUniform1f(st->u_row, st->swap ? 0.f : 1.f);
              draw(st, GL_TRIANGLES, q, 6);

              eglSwapBuffers(st->d, st->s);
          }

          /* ---- ciclo de vida y entrada ---- */
          static void on_cmd(struct android_app *app, int32_t cmd) {
              St *st = (St *)app->userData;
              if (cmd == APP_CMD_INIT_WINDOW && app->window) {
                  st->ready = (gl_init(st, app->window) == 0);
              } else if (cmd == APP_CMD_TERM_WINDOW) {
                  gl_term(st);
              }
          }

          static int32_t on_input(struct android_app *app, AInputEvent *e) {
              St *st = (St *)app->userData;
              if (AInputEvent_getType(e) == AINPUT_EVENT_TYPE_MOTION &&
                  (AMotionEvent_getAction(e) & AMOTION_EVENT_ACTION_MASK) == AMOTION_EVENT_ACTION_DOWN) {
                  st->swap = !st->swap;
                  LOG("toque: swap=%d", st->swap);
                  return 1;
              }
              return 0;
          }

          void android_main(struct android_app *app) {
              St st;
              char path[512];
              const char *dir;
              long frames = 0;
              memset(&st, 0, sizeof st);
              st.d = EGL_NO_DISPLAY;
              st.s = EGL_NO_SURFACE;
              st.c = EGL_NO_CONTEXT;
              app->userData = &st;
              app->onAppCmd = on_cmd;
              app->onInputEvent = on_input;

              dir = app->activity->externalDataPath ? app->activity->externalDataPath
                                                    : app->activity->internalDataPath;
              snprintf(path, sizeof path, "%s/log.txt", dir);
              g_log = fopen(path, "w");
              LOG("srdc iniciado. log en: %s", path);

              for (;;) {
                  int ev;
                  struct android_poll_source *src;
                  while (ALooper_pollOnce(st.ready ? 0 : -1, 0, &ev, (void **)&src) >= 0) {
                      if (src) src->process(app, src);
                      if (app->destroyRequested) { gl_term(&st); LOG("salida"); return; }
                  }
                  if (st.ready) {
                      struct timespec ts;
                      clock_gettime(CLOCK_MONOTONIC, &ts);
                      render(&st, (float)ts.tv_sec + (float)ts.tv_nsec * 1e-9f);
                      if (++frames % 600 == 0) LOG("frames=%ld", frames);
                  }
              }
          }
          EOF

          find $P -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p android-min assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SonicRushAndroid-debug-apk
          path: android-min/app/build/outputs/apk/debug/*.apk
