name: Android smoke test

# Pega este archivo en tu fork como: .github/workflows/android-smoke.yml
# Al guardarlo (commit) se ejecuta solo. Tambien puedes lanzarlo a mano
# desde Actions > "Android smoke test" > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar proyecto Android minimo (NativeActivity + GLES2)
        run: |
          set -e
          P=android-min
          mkdir -p $P/app/src/main/cpp

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SonicRushAndroid"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.srdc.port'
              compileSdk 34
              ndkVersion '26.1.10909125'

              defaultConfig {
                  applicationId 'com.srdc.port'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '0.1'
                  ndk { abiFilters 'arm64-v8a' }
              }

              externalNativeBuild {
                  cmake {
                      path 'src/main/cpp/CMakeLists.txt'
                      version '3.22.1'
                  }
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:label="Sonic Rush Port"
                  android:hasCode="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout|uiMode|smallestScreenSize|density">
                      <meta-data android:name="android.app.lib_name" android:value="srdc" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(srdc C)

          set(GLUE ${ANDROID_NDK}/sources/android/native_app_glue)
          add_library(native_app_glue STATIC ${GLUE}/android_native_app_glue.c)
          target_include_directories(native_app_glue PUBLIC ${GLUE})

          add_library(srdc SHARED main.c)
          set_target_properties(srdc PROPERTIES LINK_FLAGS "-u ANativeActivity_onCreate")
          target_link_libraries(srdc native_app_glue android EGL GLESv2 log m)
          EOF

          cat > $P/app/src/main/cpp/main.c <<'EOF'
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <android/log.h>
          #include <android_native_app_glue.h>
          #include <math.h>
          #include <time.h>

          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "srdc", __VA_ARGS__)

          typedef struct {
              EGLDisplay d;
              EGLSurface s;
              EGLContext c;
              int ready;
              int invert;
          } St;

          static int gl_init(St *st, ANativeWindow *w) {
              const EGLint cfg[] = {
                  EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                  EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                  EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8,
                  EGL_DEPTH_SIZE, 16, EGL_NONE};
              const EGLint ctx[] = {EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE};
              EGLConfig c;
              EGLint n = 0;
              st->d = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              eglInitialize(st->d, 0, 0);
              if (!eglChooseConfig(st->d, cfg, &c, 1, &n) || n < 1) { LOG("eglChooseConfig fallo"); return -1; }
              st->s = eglCreateWindowSurface(st->d, c, w, 0);
              st->c = eglCreateContext(st->d, c, EGL_NO_CONTEXT, ctx);
              if (!eglMakeCurrent(st->d, st->s, st->s, st->c)) { LOG("eglMakeCurrent fallo"); return -1; }
              LOG("GL_RENDERER=%s", (const char *)glGetString(GL_RENDERER));
              LOG("GL_VERSION=%s", (const char *)glGetString(GL_VERSION));
              return 0;
          }

          static void gl_term(St *st) {
              if (st->d != EGL_NO_DISPLAY) {
                  eglMakeCurrent(st->d, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (st->c != EGL_NO_CONTEXT) eglDestroyContext(st->d, st->c);
                  if (st->s != EGL_NO_SURFACE) eglDestroySurface(st->d, st->s);
                  eglTerminate(st->d);
              }
              st->d = EGL_NO_DISPLAY;
              st->s = EGL_NO_SURFACE;
              st->c = EGL_NO_CONTEXT;
              st->ready = 0;
          }

          static void on_cmd(struct android_app *app, int32_t cmd) {
              St *st = (St *)app->userData;
              if (cmd == APP_CMD_INIT_WINDOW && app->window) {
                  st->ready = (gl_init(st, app->window) == 0);
              } else if (cmd == APP_CMD_TERM_WINDOW) {
                  gl_term(st);
              }
          }

          static int32_t on_input(struct android_app *app, AInputEvent *e) {
              St *st = (St *)app->userData;
              if (AInputEvent_getType(e) == AINPUT_EVENT_TYPE_MOTION &&
                  (AMotionEvent_getAction(e) & AMOTION_EVENT_ACTION_MASK) == AMOTION_EVENT_ACTION_DOWN) {
                  st->invert = !st->invert;
                  LOG("toque: invert=%d", st->invert);
                  return 1;
              }
              return 0;
          }

          void android_main(struct android_app *app) {
              St st = {EGL_NO_DISPLAY, EGL_NO_SURFACE, EGL_NO_CONTEXT, 0, 0};
              app->userData = &st;
              app->onAppCmd = on_cmd;
              app->onInputEvent = on_input;
              for (;;) {
                  int ev;
                  struct android_poll_source *src;
                  while (ALooper_pollOnce(st.ready ? 0 : -1, 0, &ev, (void **)&src) >= 0) {
                      if (src) src->process(app, src);
                      if (app->destroyRequested) { gl_term(&st); return; }
                  }
                  if (st.ready) {
                      struct timespec ts;
                      clock_gettime(CLOCK_MONOTONIC, &ts);
                      float t = (float)ts.tv_sec + (float)ts.tv_nsec * 1e-9f;
                      float r = 0.5f + 0.5f * sinf(t);
                      float g = 0.5f + 0.5f * sinf(t + 2.1f);
                      float b = 0.5f + 0.5f * sinf(t + 4.2f);
                      if (st.invert) { r = 1.f - r; g = 1.f - g; b = 1.f - b; }
                      glClearColor(r, g, b, 1.f);
                      glClear(GL_COLOR_BUFFER_BIT);
                      eglSwapBuffers(st.d, st.s);
                  }
              }
          }
          EOF

          find $P -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p android-min assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SonicRushAndroid-debug-apk
          path: android-min/app/build/outputs/apk/debug/*.apk
